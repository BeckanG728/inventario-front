<div class="auth-screen">
  <div class="auth-card">
    <h1>Cambiar contraseña</h1>
    <p class="subtitle">Tu contraseña es temporal: defina una nueva para continuar.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-panel" novalidate>
      @if (generalError()) {
        <div class="inline-alert inline-alert--error" role="alert">
          <span>{{ generalError() }}</span>
        </div>
      }

      <app-field
        label="Contraseña actual"
        forId="password-actual"
        [required]="true"
        hint="La contraseña temporal que usa para ingresar"
        [error]="passwordActualError()"
      >
        <div class="password-wrap">
          <input
            id="password-actual"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="passwordActual"
            autocomplete="current-password"
            placeholder="Ingresa tu contraseña actual"
            [attr.aria-invalid]="!!passwordActualError()"
          />
          <button
            type="button"
            class="toggle-visibility"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
          >
            @if (showPassword()) { Ocultar } @else { Ver }
          </button>
        </div>
      </app-field>

      <app-field
        label="Nueva contraseña"
        forId="nueva-password"
        [required]="true"
        hint="Mínimo 8 caracteres, al menos una mayúscula y un número"
        [error]="nuevaPasswordError()"
      >
        <input
          id="nueva-password"
          type="password"
          formControlName="nuevaPassword"
          autocomplete="new-password"
          placeholder="Ingresa la nueva contraseña"
          [attr.aria-invalid]="!!nuevaPasswordError()"
        />
      </app-field>

      <app-field
        label="Confirmar contraseña"
        forId="confirmar-password"
        [required]="true"
        [error]="confirmacionError()"
      >
        <input
          id="confirmar-password"
          type="password"
          formControlName="confirmacion"
          autocomplete="new-password"
          placeholder="Repite la nueva contraseña"
          [attr.aria-invalid]="!!confirmacionError()"
        />
      </app-field>

      <app-button
        type="submit"
        variant="primary"
        size="lg"
        [block]="true"
        [loading]="submitting()"
      >
        Guardar nueva contraseña
      </app-button>
    </form>
  </div>
</div>
