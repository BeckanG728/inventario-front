
    <div class="auth-screen">
      <div class="auth-card">
        <h1>Iniciar sesión</h1>
        <p class="subtitle">Sistema de Gestión de Inventario — Taller Mecánico</p>

        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-panel" novalidate>
          @if (errorMessage()) {
            <div
              class="inline-alert"
              [class.inline-alert--warning]="errorCode() === 'RATE_LIMIT_EXCEEDED'"
              [class.inline-alert--error]="errorCode() !== 'RATE_LIMIT_EXCEEDED'"
              role="alert"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
              <span>{{ errorMessage() }}</span>
            </div>
          }

          <app-field
            label="Usuario"
            forId="username"
            [required]="true"
            variant="pill"
            [error]="usernameError()"
          >
            <input
              id="username"
              type="text"
              formControlName="username"
              autocomplete="username"
              placeholder="Ingresa tu nombre de usuario"
              [attr.aria-invalid]="!!usernameError()"
            />
          </app-field>

          <app-field
            label="Contraseña"
            forId="password"
            [required]="true"
            variant="pill"
            [error]="passwordError()"
          >
            <div class="password-wrap">
              <input
                id="password"
                [type]="showPassword() ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                placeholder="Ingresa tu contraseña"
                [attr.aria-invalid]="!!passwordError()"
              />
              <button
                type="button"
                class="toggle-visibility"
                (click)="togglePasswordVisibility()"
                [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
              >
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  @if (showPassword()) {
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                  } @else {
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  }
                </svg>
              </button>
            </div>
          </app-field>

          <app-button
            type="submit"
            variant="primary"
            size="lg"
            [block]="true"
            [loading]="submitting()"
          >
            Ingresar al sistema
          </app-button>
        </form>
      </div>
    </div>
