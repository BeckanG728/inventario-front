<app-modal
  title="Registrar nuevo usuario"
  size="md"
  [(isOpen)]="isOpen"
  (closed)="onCancel()"
>
  @if (generalError()) {
    <div class="inline-alert inline-alert--error form-alert" role="alert">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span>{{ generalError() }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" id="createUsuarioForm" novalidate>
    <app-field
      label="Nombre de usuario"
      forId="create-username"
      [required]="true"
      hint="De 3 a 20 caracteres; solo letras, números y _"
      [error]="usernameError()"
    >
      <input
        id="create-username"
        type="text"
        formControlName="username"
        autocomplete="off"
        placeholder="Ej. juan_perez"
        [attr.aria-invalid]="!!usernameError()"
      />
    </app-field>

    <app-field
      label="Contraseña inicial"
      forId="create-password"
      [required]="true"
      hint="Mínimo 8 caracteres, al menos una mayúscula y un número"
      [error]="passwordError()"
    >
      <div class="password-wrap">
        <input
          id="create-password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="new-password"
          placeholder="Ingresa la contraseña para el usuario"
          [attr.aria-invalid]="!!passwordError()"
        />
        <button
          type="button"
          class="toggle-visibility"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Ver contraseña'"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            @if (showPassword()) {
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            } @else {
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            }
          </svg>
        </button>
      </div>
    </app-field>

    <app-field
      label="Rol asignado"
      forId="create-role"
      [required]="true"
      hint="Determina los accesos y operaciones autorizadas en el sistema"
      [error]="roleError()"
    >
      <select
        id="create-role"
        formControlName="role"
        [attr.aria-invalid]="!!roleError()"
      >
        <option value="MECANICO">Mecánico (Registra consumos, consulta productos y alertas)</option>
        <option value="JEFE_TALLER">Jefe de Taller (Administra catálogo, entradas y reportes)</option>
      </select>
    </app-field>
  </form>

  <div modal-footer class="dialog-actions">
    <app-button variant="secondary" [disabled]="submitting()" (btnClick)="onCancel()">
      Cancelar
    </app-button>
    <app-button
      type="submit"
      variant="primary"
      [loading]="submitting()"
      (btnClick)="onSubmit()"
    >
      Registrar usuario
    </app-button>
  </div>
</app-modal>
