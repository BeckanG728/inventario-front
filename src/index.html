<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <title>Sistema de Gestión de Inventario</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Critical CSS inline: evita FOUC y bloqueo de render en el primer paint -->
  <style>
    :root {
      color-scheme: light;
      --color-bg: #F1F5F9;
      --color-surface: #FFFFFF;
      --color-text-primary: #0F172A;
      --color-text-secondary: #334155;
      --color-primary: #2563EB;
      --color-border: #CBD5E1;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --color-bg: #0F172A;
      --color-surface: #1E293B;
      --color-text-primary: #F8FAFC;
      --color-text-secondary: #94A3B8;
      --color-border: #334155;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { font-size: 16px; color-scheme: light; }
    body {
      margin: 0;
      font-family: var(--font-family);
      font-size: 14px;
      line-height: 1.5;
      color: var(--color-text-primary);
      background-color: var(--color-bg);
      -webkit-font-smoothing: antialiased;
    }
    /* Shell de carga inicial: spinner centrado mientras Angular bootea */
    app-root:empty::before {
      content: '';
      display: block;
      width: 32px;
      height: 32px;
      margin: 30vh auto 0;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      app-root:empty::before { animation: none; opacity: 0.5; }
    }
  </style>

  <!-- Inline script: aplica tema guardado ANTES del primer paint (evita flash) -->
  <script>
    (function(){
      try {
        var t = localStorage.getItem('app_theme');
        if (t === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch(e) {}
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
